id = "qwen"
version = "2026.07.26.1"
min_engine_version = 1
updated_at = "2026-07-26T00:00:00Z"
aliases = ["qwen-code"]

[[rules]]
id = "approval_or_permission_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(8)"
visible_blocker = true
any = [
  { contains = ["│ Apply this change"] },
  { contains = ["│ Allow execution"] },
  { contains = ["│ Do you want to proceed?"] },
  { all = [{ contains = ["permission required"] }, { any = [{ contains = ["allow"] }, { contains = ["deny"] }, { contains = ["cancel"] }] }] },
  { all = [{ contains = ["waiting for user confirmation"] }, { any = [{ contains = ["yes"] }, { contains = ["allow"] }] }] },
]

[[rules]]
id = "escape_to_cancel_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(4)"
visible_working = true
regex = ['(?i)esc(?:ape)? to cancel']
